server:
  port: 8080

spring:
  application:
    name: feed

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    properties:
      security.protocol: SSL
    consumer:
      group-id: feed-fanout
      auto-offset-reset: earliest

  flyway:
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] [%X{userId}] %logger{36} - %msg%n"
