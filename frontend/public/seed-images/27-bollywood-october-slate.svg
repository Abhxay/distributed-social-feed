<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b1e"/>
      <stop offset="60%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="facade27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d33"/>
      <stop offset="100%" stop-color="#1a1b1e"/>
    </linearGradient>
    <radialGradient id="glow27" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f3b26b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f3b26b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur27" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur27" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg27)"/>
  <rect width="800" height="450" fill="url(#glow27)"/>

  <!-- night sky stars -->
  <circle cx="80" cy="60" r="1.5" fill="#fafafa" opacity="0.5"/>
  <circle cx="650" cy="50" r="1.5" fill="#fafafa" opacity="0.5"/>
  <circle cx="720" cy="100" r="1.2" fill="#fafafa" opacity="0.4"/>
  <circle cx="40" cy="140" r="1.2" fill="#fafafa" opacity="0.4"/>

  <!-- cinema hall facade, domed / arched vintage shape -->
  <path d="M 180 400 L 180 220 Q 180 120 400 110 Q 620 120 620 220 L 620 400 Z"
        fill="url(#facade27)" stroke="#2b2d33" stroke-width="2"/>

  <!-- dome top ornament -->
  <circle cx="400" cy="100" r="14" fill="#f3b26b" opacity="0.85" filter="url(#softblur27)"/>
  <rect x="396" y="60" width="8" height="40" fill="#2b2d33"/>

  <!-- arch columns -->
  <rect x="210" y="230" width="22" height="170" fill="#121214" opacity="0.5"/>
  <rect x="568" y="230" width="22" height="170" fill="#121214" opacity="0.5"/>
  <rect x="290" y="230" width="18" height="170" fill="#121214" opacity="0.4"/>
  <rect x="492" y="230" width="18" height="170" fill="#121214" opacity="0.4"/>

  <!-- central grand entrance arch, glowing -->
  <path d="M 340 400 L 340 280 Q 340 230 400 230 Q 460 230 460 280 L 460 400 Z"
        fill="#d9a05b" opacity="0.55" filter="url(#blur27)"/>
  <path d="M 355 400 L 355 285 Q 355 245 400 245 Q 445 245 445 285 L 445 400 Z"
        fill="#0a0a0c"/>

  <!-- marquee light bulbs tracing the facade arch -->
  <g filter="url(#softblur27)">
    <circle cx="190" cy="390" r="5" fill="#fb7185"/>
    <circle cx="188" cy="340" r="5" fill="#f3b26b"/>
    <circle cx="190" cy="280" r="5" fill="#fb7185"/>
    <circle cx="205" cy="225" r="5" fill="#f3b26b"/>
    <circle cx="250" cy="165" r="5" fill="#fb7185"/>
    <circle cx="320" cy="128" r="5" fill="#f3b26b"/>
    <circle cx="400" cy="112" r="5" fill="#fb7185"/>
    <circle cx="480" cy="128" r="5" fill="#f3b26b"/>
    <circle cx="550" cy="165" r="5" fill="#fb7185"/>
    <circle cx="595" cy="225" r="5" fill="#f3b26b"/>
    <circle cx="610" cy="280" r="5" fill="#fb7185"/>
    <circle cx="612" cy="340" r="5" fill="#f3b26b"/>
    <circle cx="610" cy="390" r="5" fill="#fb7185"/>
  </g>

  <!-- colorful awning / banner strip (no text) -->
  <g>
    <rect x="180" y="205" width="55" height="20" fill="#a78bfa" opacity="0.8"/>
    <rect x="235" y="205" width="55" height="20" fill="#34d399" opacity="0.8"/>
    <rect x="290" y="205" width="55" height="20" fill="#f3b26b" opacity="0.8"/>
    <rect x="345" y="205" width="55" height="20" fill="#fb7185" opacity="0.8"/>
    <rect x="400" y="205" width="55" height="20" fill="#34d399" opacity="0.8"/>
    <rect x="455" y="205" width="55" height="20" fill="#a78bfa" opacity="0.8"/>
    <rect x="510" y="205" width="55" height="20" fill="#f3b26b" opacity="0.8"/>
    <rect x="565" y="205" width="55" height="20" fill="#fb7185" opacity="0.8"/>
  </g>

  <!-- ground glow -->
  <ellipse cx="400" cy="408" rx="260" ry="18" fill="#f3b26b" opacity="0.25" filter="url(#blur27)"/>
</svg>
