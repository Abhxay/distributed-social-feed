<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b1e"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="screen18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pad18" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d33"/>
      <stop offset="100%" stop-color="#1a1b1e"/>
    </linearGradient>
    <radialGradient id="glow18" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softblur18" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg18)"/>
  <rect width="800" height="450" fill="url(#glow18)"/>

  <!-- glowing screen, upper right -->
  <g>
    <rect x="430" y="60" width="300" height="190" rx="14" fill="#0a0a0c" stroke="#2b2d33" stroke-width="3"/>
    <rect x="450" y="80" width="260" height="150" rx="6" fill="url(#screen18)" opacity="0.9"/>
    <rect x="450" y="80" width="260" height="150" rx="6" fill="#121214" opacity="0.15"/>
    <!-- UI bits on screen -->
    <rect x="470" y="100" width="70" height="14" rx="7" fill="#fafafa" opacity="0.8"/>
    <rect x="470" y="124" width="140" height="8" rx="4" fill="#fafafa" opacity="0.5"/>
    <rect x="470" y="140" width="100" height="8" rx="4" fill="#fafafa" opacity="0.4"/>
    <circle cx="660" cy="190" r="26" fill="#fafafa" opacity="0.85"/>
    <circle cx="660" cy="190" r="14" fill="#7c3aed"/>
    <polygon points="615,205 635,195 635,215" fill="#fafafa" opacity="0.7"/>
  </g>

  <!-- headset, left -->
  <g filter="url(#softblur18)">
    <path d="M 120 230 A 110 110 0 0 1 340 230" fill="none" stroke="#fb7185" stroke-width="16" stroke-linecap="round"/>
  </g>
  <rect x="95" y="225" width="55" height="80" rx="20" fill="url(#pad18)" stroke="#fb7185" stroke-width="3"/>
  <rect x="310" y="225" width="55" height="80" rx="20" fill="url(#pad18)" stroke="#fb7185" stroke-width="3"/>
  <path d="M 122 300 Q 110 330 150 345" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="155" cy="347" r="5" fill="#f3b26b"/>

  <!-- controller, bottom center -->
  <g>
    <path d="M 310 330 Q 300 300 340 295 L 460 295 Q 500 300 490 330
             Q 520 340 510 375 Q 500 405 470 395
             Q 450 390 440 370 L 360 370
             Q 350 390 330 395 Q 300 405 290 375
             Q 280 340 310 330 Z"
          fill="url(#pad18)" stroke="#34d399" stroke-width="3"/>
    <!-- d-pad -->
    <rect x="325" y="330" width="30" height="10" rx="2" fill="#fafafa" opacity="0.75"/>
    <rect x="335" y="320" width="10" height="30" rx="2" fill="#fafafa" opacity="0.75"/>
    <!-- buttons -->
    <circle cx="455" cy="325" r="7" fill="#fb7185"/>
    <circle cx="475" cy="335" r="7" fill="#34d399"/>
    <circle cx="455" cy="345" r="7" fill="#a78bfa"/>
    <circle cx="435" cy="335" r="7" fill="#f3b26b"/>
    <!-- sticks -->
    <circle cx="360" cy="350" r="12" fill="#121214" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="420" cy="310" r="12" fill="#121214" stroke="#7c3aed" stroke-width="2"/>
  </g>

  <!-- neon accent particles -->
  <circle cx="60" cy="100" r="3" fill="#34d399" opacity="0.7"/>
  <circle cx="760" cy="300" r="3" fill="#fb7185" opacity="0.7"/>
  <circle cx="720" cy="380" r="2.5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="40" cy="380" r="2.5" fill="#f3b26b" opacity="0.6"/>
</svg>
