<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow19" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softblur19" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="glowblur19" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg19)"/>
  <rect width="800" height="450" fill="url(#glow19)"/>

  <!-- humanoid wireframe: head + shoulders, built from nodes and connecting lines -->
  <g stroke="url(#line19)" stroke-width="1.4" opacity="0.85" fill="none">
    <!-- head outline (low-poly) -->
    <polygon points="400,95 440,115 452,160 430,205 400,225 370,205 348,160 360,115"/>
    <line x1="400" y1="95" x2="400" y2="225"/>
    <line x1="348" y1="160" x2="452" y2="160"/>
    <line x1="360" y1="115" x2="430" y2="205"/>
    <line x1="440" y1="115" x2="370" y2="205"/>

    <!-- neck -->
    <line x1="400" y1="225" x2="400" y2="255"/>

    <!-- shoulders / torso wireframe -->
    <path d="M 280 390 L 330 265 L 400 255 L 470 265 L 520 390"/>
    <line x1="330" y1="265" x2="400" y2="320"/>
    <line x1="470" y1="265" x2="400" y2="320"/>
    <line x1="400" y1="320" x2="400" y2="390"/>
    <line x1="300" y1="330" x2="500" y2="330"/>
  </g>

  <!-- glowing nodes at joints -->
  <g filter="url(#softblur19)">
    <circle cx="400" cy="95" r="3.5" fill="#a78bfa"/>
    <circle cx="360" cy="115" r="3.5" fill="#34d399"/>
    <circle cx="440" cy="115" r="3.5" fill="#34d399"/>
    <circle cx="348" cy="160" r="3.5" fill="#a78bfa"/>
    <circle cx="452" cy="160" r="3.5" fill="#a78bfa"/>
    <circle cx="370" cy="205" r="3.5" fill="#34d399"/>
    <circle cx="430" cy="205" r="3.5" fill="#34d399"/>
    <circle cx="400" cy="225" r="4" fill="#fb7185"/>
    <circle cx="330" cy="265" r="3.5" fill="#a78bfa"/>
    <circle cx="470" cy="265" r="3.5" fill="#a78bfa"/>
    <circle cx="400" cy="320" r="4.5" fill="#fb7185"/>
    <circle cx="280" cy="390" r="3" fill="#34d399"/>
    <circle cx="520" cy="390" r="3" fill="#34d399"/>
    <circle cx="300" cy="330" r="3" fill="#a78bfa"/>
    <circle cx="500" cy="330" r="3" fill="#a78bfa"/>
    <circle cx="400" cy="390" r="3" fill="#34d399"/>
  </g>

  <!-- neural pathway glow strands radiating outward -->
  <g filter="url(#glowblur19)" opacity="0.5">
    <circle cx="400" cy="150" r="90" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="400" cy="150" r="140" fill="none" stroke="#34d399" stroke-width="1.5"/>
  </g>

  <!-- scattered data motes -->
  <circle cx="150" cy="120" r="2" fill="#34d399" opacity="0.7"/>
  <circle cx="650" cy="150" r="2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="620" cy="280" r="2.2" fill="#fb7185" opacity="0.6"/>
  <circle cx="180" cy="300" r="2.2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="200" cy="200" r="1.6" fill="#34d399" opacity="0.5"/>
  <circle cx="600" cy="200" r="1.6" fill="#34d399" opacity="0.5"/>
</svg>
